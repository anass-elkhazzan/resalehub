<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResaleHub — Furniture & Art</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h1>ResaleHub</h1>
      <p>Furniture &amp; Art Resale</p>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="navigate('dashboard')">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="navigate('inventory')">
        <span class="icon">📦</span> Inventory
      </button>
      <button class="nav-item" onclick="navigate('add')">
        <span class="icon">➕</span> Add Item
      </button>
      <button class="nav-item" onclick="navigate('website')">
        <span class="icon">🌐</span> My Website
      </button>
      <button class="nav-item" onclick="navigate('settings')">
        <span class="icon">⚙️</span> Settings
      </button>
    </nav>
    <div class="sidebar-footer">
      <p id="sidebar-count">Loading...</p>
    </div>
  </aside>
  <div class="overlay-backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:.75rem">
        <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
        <span class="topbar-title" id="page-title">Dashboard</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-gold" onclick="navigate('add')">+ Add Item</button>
      </div>
    </header>

    <main class="content" id="content">
      <!-- Pages render here -->
    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Modals -->
<div class="modal-overlay" id="modal-sold">
  <div class="modal-box sm">
    <div class="modal-header">
      <h2>Mark as Sold</h2>
      <button class="modal-close" onclick="closeModal('modal-sold')">✕</button>
    </div>
    <div class="modal-body">
      <div class="sold-form">
        <div class="form-group">
          <label>Sale Price</label>
          <input type="number" id="sold-price" class="form-input" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Platform Sold On</label>
          <select id="sold-platform" class="form-select">
            <option value="facebook">Facebook Marketplace</option>
            <option value="ebay">eBay</option>
            <option value="etsy">Etsy</option>
            <option value="craigslist">Craigslist</option>
            <option value="offerup">OfferUp</option>
            <option value="other">Other / In Person</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-sold')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmSold()">Confirm Sale</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-delete">
  <div class="modal-box sm">
    <div class="modal-header">
      <h2>Delete Item</h2>
      <button class="modal-close" onclick="closeModal('modal-delete')">✕</button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete <strong id="delete-name"></strong>? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-delete')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
